# Unit tests, the deterministic performance budgets, and the app in software WebGL2 (plan 01, T0.1 and T0.8).
# Golden images are compared only where a snapshot for the runner's platform is committed; until Linux goldens
# exist (run the "linux-goldens" job by hand and commit its artifact, see tests/README.md) the baseline spec
# renders every scene and checks for errors but compares nothing.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      linux_goldens:
        description: Generate Linux golden images and upload them as an artifact
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit
      - uses: astral-sh/setup-uv@v10.4.0
      - run: pnpm test:py
      # the drive's data pipeline tests (pytest, through uv; tests/data/requirements.txt)
      - run: pnpm test:data
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: '1'
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # The app on Chromium's software WebGPU adapter (plan 01, decision 6; flags from T2.0). Not required yet: it
  # becomes a required check once it has passed here for a week. Until then a local report from a real GPU
  # (tests/reference/reports/) is required for changes under src/render, src/sky, src/weather or the materials.
  webgpu-software:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:webgpu
        env:
          CI: '1'

  linux-goldens:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.linux_goldens }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:goldens:update
        env:
          CI: '1'
      - uses: actions/upload-artifact@v7
        with:
          name: linux-goldens
          path: tests/reference/baseline/linux/
