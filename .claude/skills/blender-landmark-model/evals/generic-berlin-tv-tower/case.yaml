schema_version: "1.1"
name: generic-berlin-tv-tower
expected_outcome: |
  A closed, low-poly (under 3,000 triangles), true-scale (about 368 m) model of the Berlin TV tower is built in a
  fresh headless Blender process, with its concrete shaft, sphere and antenna at sourced heights, exported as a
  GLB with night lighting in a _GLOW vertex attribute and no COLOR_0, with reference photos and preview renders
  by day and night saved alongside. No logos or brand graphics are modeled.
