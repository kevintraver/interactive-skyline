<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sprite and surface light parity</title>
  <link rel="icon" href="data:,">
  <style>html, body { margin: 0; background: #000; color: #ccc; font: 12px monospace; } canvas { display: inline-block; margin: 2px; width: 240px; }</style>
</head>
<body>
  <!--
    The port's feedback loop for the light sprites and the surface-light helper (plan 02, third stretch, decision 1):
    one fixed fixture drawn three times, with the GLSL modules on a WebGLRenderer and with the node modules on a
    WebGPURenderer (its WebGL2 backend and its WebGPU backend), linear, no tone mapping, at the classic scale
    (LIGHTING_UNITS), into half-float targets read back and compared here. Driven by sprites-node-shots.mjs:
      window.__parity.cases            the case names
      await window.__parity.run(name, mode)  { name, rows: [{ backend, madPct, relPct, maxAbs, pass }], images }; mode
                                       'toned' or 'hdr' (sprite cases: see MODE below)
      await window.__parity.flux()     summed energy of single sprites against I / d^2, per backend
      await window.__parity.cost(n, frames, nearM)  GPU time of n sprites in view (log-uniform from nearM to 15 km),
                                       per layer and backend
    Checks of the loop itself: ?missing=1 loads the node modules from a path that does not exist (every case must
    FAIL); ?perturb=1.03 draws the node side's light 3 % too bright (every lit case must FAIL).
  -->
  <div id="log">loading</div>
  <script type="module">
    import * as THREE from 'three';
    import * as WGPU from 'three/webgpu';
    import { uniform, vec3, float, dot, max, pow } from 'three/tsl';
    import * as glslSprites from '../../src/drive/lights/sprites.js';
    import { addSurfaceTerm as addGlslTerm } from '../../src/drive/lights/surfaceLight.js';

    const log = (s) => { document.getElementById('log').textContent = s; };
    const load = async (p) => { try { return await import(p); } catch (e) { return { __error: String((e && e.stack) || e).slice(0, 600) }; } };
    const Q = new URLSearchParams(location.search);
    const MISSING = Q.get('missing') ? '.missing' : '';
    const PERTURB = Number(Q.get('perturb')) || 1;
    const nodeSprites = await load(`../../src/drive/lights/sprites${MISSING}.node.js`);
    const nodeSurface = await load(`../../src/drive/lights/surfaceLight${MISSING}.node.js`);
    const building = await load('../../src/render/materials/buildingMaterial.js');

    const W = 480, H = 320, FOV = 50;
    const CLASSIC = { display: 'classic' };
    const GAIN = 0.1; // LIGHTING_UNITS.nit: the classic scale
    const canvas = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; document.body.appendChild(c); return c; };

    // ------------------------------------------------------------------ the three renderers
    const gl = new THREE.WebGLRenderer({ canvas: canvas(), antialias: false });
    gl.setPixelRatio(1); gl.setSize(W, H, false);
    gl.toneMapping = THREE.NoToneMapping; gl.outputColorSpace = THREE.LinearSRGBColorSpace;
    async function nodeRenderer(forceWebGL) {
      const r = new WGPU.WebGPURenderer({ canvas: canvas(), antialias: false, forceWebGL, reversedDepthBuffer: true, trackTimestamp: true });
      await r.init();
      if (!r.reversedDepthBuffer) r.logarithmicDepthBuffer = true; // as src/render/renderer.js
      r.setPixelRatio(1); r.setSize(W, H, false);
      r.toneMapping = THREE.NoToneMapping; r.outputColorSpace = THREE.LinearSRGBColorSpace;
      return r;
    }
    const renderers = { webgl2: await nodeRenderer(true), webgpu: await nodeRenderer(false) };
    const backendOf = { webgl2: renderers.webgl2.backend.isWebGPUBackend ? 'webgpu?!' : 'webgl2', webgpu: renderers.webgpu.backend.isWebGPUBackend ? 'webgpu' : 'webgl2 (no WebGPU adapter)' };

    const glTarget = (w = W, h = H) => new THREE.WebGLRenderTarget(w, h, { type: THREE.HalfFloatType, depthBuffer: true });
    const nodeTarget = (w = W, h = H) => new THREE.RenderTarget(w, h, { type: THREE.HalfFloatType, depthBuffer: true });

    /** Linear RGB floats, rows bottom-up, from the GLSL renderer's target. */
    function readGl(rt) {
      gl.setRenderTarget(rt);
      const g = gl.getContext(), out = new Float32Array(rt.width * rt.height * 4);
      g.readPixels(0, 0, rt.width, rt.height, g.RGBA, g.FLOAT, out);
      gl.setRenderTarget(null);
      return out;
    }
    async function readNode(r, rt) {
      const raw = await r.readRenderTargetPixelsAsync(rt, 0, 0, rt.width, rt.height);
      const n = rt.width * rt.height * 4, f = new Float32Array(n);
      if (raw instanceof Uint16Array) for (let i = 0; i < n; i++) f[i] = THREE.DataUtils.fromHalfFloat(raw[i]);
      else f.set(raw.subarray(0, n));
      if (!r.backend.isWebGPUBackend) return f;
      const row = rt.width * 4, flipped = new Float32Array(n); // WebGPU reads top-down
      for (let y = 0; y < rt.height; y++) flipped.set(f.subarray(y * row, (y + 1) * row), (rt.height - 1 - y) * row);
      return flipped;
    }

    const camera = (pos = [0, 0, 0], look = [0, 0, -1], w = W, h = H) => {
      const c = new THREE.PerspectiveCamera(FOV, w / h, 0.5, 40000);
      c.position.set(...pos); c.lookAt(...look); c.updateMatrixWorld(); c.updateProjectionMatrix();
      return c;
    };
    const pixelAngle = (h = H) => (2 * Math.tan((FOV * Math.PI) / 360)) / h;

    // ------------------------------------------------------------------ fixtures
    // Each builds its scene for one flavour ('gl' or 'node') and returns { scene, camera, frame(renderer) }.
    const api = (flavor) => (flavor === 'gl' ? glslSprites : nodeSprites);
    // Two modes per sprite case. 'toned': both layers as they draw to a canvas (the GLSL layer's own tone, the node
    // layer's tone: 'sprite'). 'hdr': the linear radiance before any tone, which is what the node layer writes in the
    // pipeline (tone: 'scene'); the GLSL reference then draws with a copy of its fragment shaders that leaves out the
    // final toneSprite() call, and nothing else. The tone squashes bright cores, so only 'hdr' sees a few per cent of
    // scale error (a 3 % error moved 'toned' by 0.3-0.5 %).
    let MODE = 'toned';
    const untoned = (layer) => {
      const strip = (m, from, to) => { if (!m.fragmentShader.includes(from)) throw new Error(`hdr reference: no "${from}"`); m.fragmentShader = m.fragmentShader.replace(from, to); m.needsUpdate = true; };
      strip(layer.material, 'vec3 o = toneSprite(c);', 'vec3 o = c;');
      if (layer.twins) strip(layer.twins.mesh.material, 'toneSprite(vTwAmp * (gu * gv))', 'vTwAmp * (gu * gv)');
      return layer;
    };
    const layerOf = (flavor, opts) => (flavor === 'gl'
      ? (MODE === 'hdr' ? untoned(glslSprites.createSpriteLayer(opts)) : glslSprites.createSpriteLayer(opts))
      : nodeSprites.createSpriteLayer({ ...opts, tone: MODE === 'hdr' ? 'scene' : 'sprite', photometry: CLASSIC }));
    const lambert = (flavor, p) => (flavor === 'gl' ? new THREE.MeshLambertMaterial(p) : new WGPU.MeshLambertNodeMaterial(p));
    const standard = (flavor, p) => (flavor === 'gl' ? new THREE.MeshStandardMaterial(p) : new WGPU.MeshStandardNodeMaterial(p));
    const LAMP = { kDown: 0.62, kUp: 0.04, downShare: 0.96 };
    const ON_TABLE = Float32Array.from({ length: 37 }, (_, i) => i * 12 - 30); // seconds since switch-on, by threshold

    function litGround(scene, flavor, { box = true } = {}) {
      scene.add(new THREE.HemisphereLight(0x8899aa, 0x332211, 0.6));
      const sun = new THREE.DirectionalLight(0xffeedd, 0.9); sun.position.set(3, 8, 2); scene.add(sun);
      const plane = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), lambert(flavor, { color: 0x6a6a6a }));
      plane.rotation.x = -Math.PI / 2; plane.updateMatrixWorld(); scene.add(plane);
      if (box) { const b = new THREE.Mesh(new THREE.BoxGeometry(6, 8, 6), lambert(flavor, { color: 0x8a5a3a })); b.position.set(-3, 4, -40); b.updateMatrixWorld(); scene.add(b); }
      return plane;
    }

    function spriteScene(flavor, fill, { cam = camera(), opts = {}, frame = {}, ground = null, layers = null } = {}) {
      const scene = new THREE.Scene();
      if (ground) litGround(scene, flavor, ground);
      const list = (layers || [opts]).map((o) => {
        const layer = layerOf(flavor, { capacity: 256, ...o });
        scene.add(layer.mesh);
        return layer;
      });
      const n = list.map((layer, k) => fill(layer, k));
      list.forEach((layer, k) => { if (Number.isFinite(n[k])) layer.commit(n[k]); });
      return {
        scene, camera: cam, layers: list,
        frame(r) { for (const layer of list) layer.setFrame({ camera: cam, renderer: r, gain: GAIN * (flavor === 'gl' ? 1 : PERTURB), visibility: 80000, ...frame }); },
      };
    }

    const CASES = {
      // every pattern kind, with and without an aim, the far pool glow, on black
      patterns: (f) => spriteScene(f, (L) => {
        const lobe = L.definePattern({ kind: 'lobe', exponent: 2 }), lobe6 = L.definePattern({ kind: 'lobe', exponent: 6 });
        const cut = L.definePattern({ kind: 'cutoff', ...LAMP }), drop = L.definePattern({ kind: 'droplens', ...LAMP });
        const high = L.definePattern({ kind: 'highmast', ...LAMP });
        const rows = [[0, null], [lobe, null], [lobe6, null], [cut, null], [cut, 0.7], [cut, 2.6], [drop, null], [drop, -1.2], [high, null], [high, 1]];
        rows.forEach(([pattern, aim], i) => {
          const street = pattern === cut || pattern === drop || pattern === high;
          const x = -36 + (i % 5) * 18, y = i < 5 ? 12 : -4, z = -70 - (i % 3) * 8;
          L.set(i, { position: [x, y, z], color: [1, 0.85, 0.6], intensity: street ? 9000 : 400, pattern, aim,
            axis: street ? [0, -1, 0] : [0.2, 0.1, 1].map((v, _, a) => v / Math.hypot(...a)), diameter: 0.6, mount: street ? 10 : 0 });
        });
        return rows.length;
      }, { frame: { glowRange: [20, 60], groundAlbedo: 0.2 } }),

      // one size after another, from a tenth of a pixel to ninety pixels, on black
      sizes: (f) => spriteScene(f, (L) => {
        const D = [0.008, 0.02, 0.05, 0.1, 0.2, 0.5, 1, 2, 4, 8];
        D.forEach((d, i) => L.set(i, { position: [-26 + (i % 5) * 13, i < 5 ? 6 : -7, -30], color: [0.9, 0.95, 1.1], intensity: 30 * (1 + 3 * d * d), diameter: d }));
        return D.length;
      }),

      // 5 m to 20 km, intensity kept near the same illuminance at the eye, on black
      distances: (f) => spriteScene(f, (L) => {
        const R = [5, 12, 30, 100, 300, 1000, 3000, 8000, 14000, 20000];
        R.forEach((d, i) => {
          const a = ((i - 4.5) / 10) * 0.75, e = (i % 2 ? 0.08 : -0.08);
          L.set(i, { position: [Math.sin(a) * d, Math.sin(e) * d, -Math.cos(a) * d], color: [1, 0.7, 0.4], intensity: 0.5 * d * d, diameter: 0.4 });
        });
        return R.length;
      }, { frame: { visibility: 30000 } }),

      // sodium warm-up and photocell switching (some lamps off at this ambient light), on black
      warmup: (f) => spriteScene(f, (L) => {
        const cut = L.definePattern({ kind: 'cutoff', ...LAMP });
        const T = [0.5, 2, 4, 8, 16, 40, 120, 600, 1e30, 3];
        T.forEach((t, i) => L.set(i, { position: [-36 + (i % 5) * 18, i < 5 ? 10 : 2, -60], color: [1, 0.6, 0.2], intensity: 12000, pattern: cut,
          threshold: t, warm: i % 3 === 2 ? 0 : 1, diameter: 0.5 }));
        return T.length;
      }, { frame: { ambientLux: 3, onTable: ON_TABLE, sodium: { startUv: [0.21, 0.49], steadyUv: [0.27, 0.53] } } }),

      // whiten: bright coloured lamps on two layers (1 and 0.25), on black
      whiten: (f) => spriteScene(f, (L, k) => {
        const C = [[1, 0.02, 0.01], [0.02, 1, 0.1], [0.1, 0.2, 1], [1, 0.55, 0.05], [1, 1, 1]];
        C.forEach((c, i) => L.set(i, { position: [-24 + i * 12, k ? -6 : 6, -25], color: c, intensity: [60, 600, 6000][i % 3] * 4, diameter: 0.3 + 0.2 * i }));
        return C.length;
      }, { layers: [{ whiten: 1 }, { whiten: 0.25, renderOrder: 11 }] }),

      // a draw list with weights (a thinned far cell's lamp carries k lamps' light)
      weights: (f) => spriteScene(f, (L) => {
        for (let i = 0; i < 8; i++) L.set(i, { position: [-28 + i * 8, 0, -50], color: [1, 0.9, 0.8], intensity: 200, diameter: 0.4 });
        L.commit();
        L.setDrawList([7, 1, 3, 5, 0], 5, [1, 3, 0.5, 8, 0.1]);
        return NaN;
      }),

      // sprites over a lit plane, some behind a box (depth test), the eye 1.5 m up
      'lit-plane': (f) => spriteScene(f, (L) => {
        const cut = L.definePattern({ kind: 'cutoff', ...LAMP });
        let i = 0;
        for (let z = -15; z > -400; z -= 25) for (const x of [-9, 9]) L.set(i++, { position: [x, 9, z], color: [1, 0.8, 0.55], intensity: 14000, pattern: cut, aim: x < 0 ? 0 : Math.PI, diameter: 0.5, mount: 9 });
        L.set(i++, { position: [-3, 2, -46], color: [1, 0.2, 0.1], intensity: 300, diameter: 0.3 }); // behind the box
        return i;
      }, { cam: camera([0, 1.5, 0], [0, 1.2, -30]), ground: { box: true }, frame: { glowRange: [60, 160] } }),

      // reflected twins on wet pavement around the car, lamps 9 m up along a straight road
      twins: (f) => spriteScene(f, (L) => {
        const cut = L.definePattern({ kind: 'cutoff', ...LAMP });
        let i = 0;
        for (let z = -20; z > -300; z -= 30) for (const x of [-8, 7]) L.set(i++, { position: [x, 9, z], color: [1, 0.75, 0.45], intensity: 16000, pattern: cut, aim: x < 0 ? 0 : Math.PI, diameter: 0.5 });
        for (let z = -30; z > -200; z -= 40) L.set(i++, { position: [2.5, 0.7, z], color: [1, 0.05, 0.02], intensity: 40, diameter: 0.15 }); // tail lamps
        return i;
      }, { cam: camera([0, 1.2, 0], [0, 0.9, -30]), ground: { box: false }, opts: { reflect: true } }),
    };

    // twins need the module's setTwins (shared uniforms), once the layers exist
    const TWINS = { wet: 0.8, slope: 0.06, car: { x: 0, z: 0 }, forward: { x: 0, z: -1 }, roadY: 0, grade: 0, halfWidth: 14, range: 320 };

    // ------------------------------------------------------------------ surface terms: the same light both ways
    const P = [4, 7, -30], I = 9000;
    const glslTerms = [
      { id: 'pool', key: 'test', uniforms: { uSlP: { value: new THREE.Vector3(...P) } }, head: 'uniform vec3 uSlP;',
        body: `vec3 v = uSlP - slWorld; float d2 = dot(v, v); slE += vec3(1.0, 0.8, 0.55) * (${I.toFixed(1)} * max(dot(slNormal, normalize(v)), 0.0) / max(d2, 0.25)) * 0.1;` },
      { id: 'retro', key: 'test', body: 'slL += vec3(0.3, 0.6, 1.0) * (6.0 * pow(max(dot(slNormal, slView), 0.0), 4.0)) * 0.1;' },
    ];
    const uP = uniform(new THREE.Vector3(...P));
    const nodeTerms = [
      { id: 'pool', key: 'test', lux: ({ positionWorld, normalWorld }) => {
        const v = uP.sub(positionWorld), d2 = dot(v, v);
        return vec3(1, 0.8, 0.55).mul(float(I * PERTURB).mul(max(dot(normalWorld, v.normalize()), 0)).div(d2.max(0.25)));
      } },
      { id: 'retro', key: 'test', radiance: ({ normalWorld, viewWorld }) => vec3(0.3, 0.6, 1).mul(pow(max(dot(normalWorld, viewWorld), 0), 4).mul(6 * PERTURB)) },
    ];
    // a filter after them, as the wet road's: three's diffuse x 0.7, the terms' lux x 0.5, a radiance added by the view
    const glslFilter = { id: 'wet', key: 'test', body: `
      reflectedLight.directDiffuse *= 0.7; reflectedLight.indirectDiffuse *= 0.7;
      slE *= 0.5; slL += vec3(0.2, 0.3, 0.4) * (3.0 * (1.0 - max(dot(slNormal, slView), 0.0))) * 0.1;` };
    const nodeFilter = { id: 'wet', key: 'test', filter: ({ normalWorld, viewWorld }, acc) => ({
      diffuse: 0.7, lux: acc.lux.mul(0.5),
      radiance: acc.radiance.add(vec3(0.2, 0.3, 0.4).mul(float(1).sub(max(dot(normalWorld, viewWorld), 0)).mul(3 * PERTURB))) }) };
    function surfaceScene(flavor, kind, withTerms) {
      const scene = new THREE.Scene();
      const plane = litGround(scene, flavor, { box: false });
      const make = kind === 'standard' ? standard : lambert;
      const box = new THREE.Mesh(new THREE.BoxGeometry(8, 6, 8), make(flavor, kind === 'standard' ? { color: 0x9a7a5a, roughness: 0.7, metalness: 0.3 } : { color: 0x9a7a5a }));
      box.position.set(-2, 3, -34); box.rotation.y = 0.5; box.updateMatrixWorld(); scene.add(box);
      if (kind === 'standard') plane.material = make(flavor, { color: 0x6a6a6a, roughness: 0.9, metalness: 0.1 });
      if (withTerms) for (const m of [plane.material, box.material]) {
        const filter = withTerms === 'filter';
        if (flavor === 'gl') for (const t of filter ? [...glslTerms, glslFilter] : glslTerms) addGlslTerm(m, t);
        else for (const t of filter ? [...nodeTerms, nodeFilter] : nodeTerms) nodeSurface.addSurfaceTerm(m, t, { photometry: CLASSIC });
      }
      return { scene, camera: camera([0, 2, 0], [0, 1, -30]), frame() {} };
    }
    CASES['surface-lambert'] = (f) => surfaceScene(f, 'lambert', true);
    CASES['surface-standard'] = (f) => surfaceScene(f, 'standard', true);
    CASES['surface-filter'] = (f) => surfaceScene(f, 'lambert', 'filter');

    // ------------------------------------------------------------------ drawing and comparing
    async function draw(flavor, r, fx, rt) {
      fx.frame(r);
      if (fx.layers?.some((l) => l.twins)) api(flavor).setTwins(TWINS);
      if (flavor === 'gl') {
        gl.setRenderTarget(rt); gl.setClearColor(0x000000, 1); gl.clear(); gl.render(fx.scene, fx.camera); gl.setRenderTarget(null);
        return readGl(rt);
      }
      r.setRenderTarget(rt); r.setClearColor(0x000000, 1); r.autoClear = true;
      r.render(fx.scene, fx.camera);
      r.setRenderTarget(null);
      return readNode(r, rt);
    }
    function compare(ref, got) {
      let sad = 0, sref = 0, maxAbs = 0;
      const n = ref.length / 4;
      for (let i = 0; i < n; i++) for (let c = 0; c < 3; c++) {
        const a = ref[4 * i + c], b = got[4 * i + c], d = Math.abs(a - b);
        if (!(d === d)) { sad += 1; continue; } // NaN counts as a full-scale miss
        sad += d; sref += Math.abs(a); if (d > maxAbs) maxAbs = d;
      }
      const madPct = (sad / (n * 3)) * 100, relPct = sref > 0 ? (sad / sref) * 100 : (sad > 0 ? 100 : 0);
      return { madPct, relPct, maxAbs, refMean: sref / (n * 3), pass: madPct <= 2 && relPct <= 2 };
    }
    /** A PNG of images side by side (clamped, linear to sRGB-ish by sqrt for looking), and their difference x 8. */
    function strip(images) {
      const c = document.createElement('canvas'); c.width = W * images.length; c.height = H;
      const g = c.getContext('2d'), img = g.createImageData(c.width, H);
      images.forEach((im, k) => {
        for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
          const s = 4 * ((H - 1 - y) * W + x), d = 4 * (y * c.width + k * W + x);
          for (let ch = 0; ch < 3; ch++) img.data[d + ch] = Math.round(255 * Math.sqrt(Math.min(1, Math.max(0, im[s + ch]))));
          img.data[d + 3] = 255;
        }
      });
      g.putImageData(img, 0, 0);
      return c.toDataURL('image/png');
    }
    const diffImage = (a, b) => a.map((v, i) => ((i & 3) === 3 ? 1 : Math.abs(v - b[i]) * 8));

    async function run(name, mode = 'toned') {
      MODE = mode;
      const problems = [];
      if (nodeSprites.__error) problems.push(`sprites.node.js: ${nodeSprites.__error}`);
      if (name.startsWith('surface') && nodeSurface.__error) problems.push(`surfaceLight.node.js: ${nodeSurface.__error}`);
      const rtGl = glTarget();
      const ref = await draw('gl', gl, CASES[name]('gl'), rtGl);
      let refBase = null;
      const baseKind = name === 'surface-standard' ? 'standard' : 'lambert';
      if (name.startsWith('surface')) refBase = await draw('gl', gl, surfaceScene('gl', baseKind, false), rtGl);
      const rows = [], shots = [ref];
      for (const [key, r] of Object.entries(renderers)) {
        let got = null, base = null;
        try {
          if (problems.length) throw new Error(problems.join('; '));
          got = await draw('node', r, CASES[name]('node'), nodeTarget());
          if (refBase) base = await draw('node', r, surfaceScene('node', baseKind, false), nodeTarget());
        } catch (e) { rows.push({ backend: backendOf[key], error: String(e.message || e).slice(0, 400), pass: false }); continue; }
        rows.push({ backend: backendOf[key], ...compare(ref, got) });
        if (refBase) {
          // the terms alone: (with - without) on each renderer
          const dRef = ref.map((v, i) => v - refBase[i]), dGot = got.map((v, i) => v - base[i]);
          rows.push({ backend: `${backendOf[key]} terms only`, ...compare(dRef, dGot) });
        }
        shots.push(got);
      }
      const images = shots.length > 1 ? strip([...shots, diffImage(ref, shots[shots.length - 1])]) : strip(shots);
      return { name: mode === 'hdr' ? `${name}/hdr` : name, rows, images };
    }

    // ------------------------------------------------------------------ plan 01's building material, a term on and off
    async function buildingCase() {
      if (building.__error || nodeSurface.__error) return { name: 'building-term', rows: [{ backend: 'all', error: building.__error || nodeSurface.__error, pass: false }] };
      const rows = [];
      for (const [key, r] of Object.entries(renderers)) {
        const scene = new THREE.Scene();
        litGround(scene, 'node', { box: false });
        const m = building.createBuildingMaterial({ variant: 'extruded' });
        m.color.setRGB(0.5, 0.45, 0.4);
        const emissiveBefore = m.emissiveNode;
        const box = new THREE.Mesh(new THREE.BoxGeometry(10, 12, 10), m);
        box.position.set(0, 6, -40); box.updateMatrixWorld(); scene.add(box);
        const cam = camera([0, 3, 0], [0, 5, -40]);
        const shot = async () => { r.setRenderTarget(rtB); r.render(scene, cam); r.setRenderTarget(null); return readNode(r, rtB); };
        const rtB = nodeTarget();
        const before = await shot();
        const LUX = 100;
        const remove = nodeSurface.addSurfaceTerm(m, { id: 'flat', key: 'test', lux: () => float(LUX * PERTURB) }, { photometry: CLASSIC });
        const terms = nodeSurface.surfaceTerms(m).join(',');
        const withTerm = await shot();
        remove();
        const after = await shot();
        // expected: albedo x lux / pi x 0.1 where the box is drawn (the pixels the term changed), nothing elsewhere
        const want = [0.5, 0.45, 0.4].map((a) => (a * LUX * GAIN) / Math.PI);
        let sad = 0, sref = 0, px = 0, restored = 0;
        for (let i = 0; i < before.length; i += 4) {
          const d = [0, 1, 2].map((c) => withTerm[i + c] - before[i + c]);
          if (d[0] + d[1] + d[2] > 1e-3) { px++; for (let c = 0; c < 3; c++) { sad += Math.abs(d[c] - want[c]); sref += want[c]; } }
          for (let c = 0; c < 3; c++) restored = Math.max(restored, Math.abs(after[i + c] - before[i + c]));
        }
        const own = ['setupLightingModel', 'customProgramCacheKey'].filter((k) => Object.prototype.hasOwnProperty.call(m, k));
        const relPct = sref ? (sad / sref) * 100 : 100;
        rows.push({ backend: backendOf[key], terms, boxPixels: px, relPct, restoredMaxAbs: restored, emissiveKept: m.emissiveNode === emissiveBefore,
          ownAfterRemove: own.join(',') || 'none', pass: px > 1000 && relPct <= 2 && restored === 0 && m.emissiveNode === emissiveBefore && own.length === 0 });
      }
      return { name: 'building-term', rows };
    }

    // ------------------------------------------------------------------ flux: summed energy against I / d^2
    async function flux() {
      if (nodeSprites.__error) return [{ error: nodeSprites.__error, pass: false }];
      const out = [];
      const pa = pixelAngle();
      const cases = [
        [5, 0.05, 5], [5, 0.5, 20], [5, 2, 200], [50, 0.02, 30], [50, 0.5, 60], [50, 5, 2000], [500, 0.5, 2000],
        [500, 10, 40000], [2000, 0.5, 30000], [8000, 1, 4e5], [20000, 0.5, 3e6],
      ];
      for (const [key, r] of Object.entries(renderers)) {
        for (const [d, dia, Icd] of cases) {
          const scene = new THREE.Scene();
          const L = nodeSprites.createSpriteLayer({ capacity: 4, tone: 'scene', photometry: CLASSIC });
          scene.add(L.mesh);
          L.set(0, { position: [0, 0, -d], intensity: Icd, color: [1, 1, 1], diameter: dia });
          L.commit(1);
          L.setFrame({ gain: GAIN * PERTURB, visibility: 1e12 });
          const rt = nodeTarget();
          r.setRenderTarget(rt); r.setClearColor(0, 1); r.render(scene, camera()); r.setRenderTarget(null);
          const px = await readNode(r, rt);
          let sum = 0;
          for (let i = 0; i < px.length; i += 4) sum += 0.2126 * px[i] + 0.7152 * px[i + 1] + 0.0722 * px[i + 2];
          const E = (sum * pa * pa) / GAIN, want = Icd / (d * d);
          const dPx = Math.max(dia / d / pa, 1.5);
          out.push({ backend: backendOf[key], d, diameterM: dia, dPx: +dPx.toFixed(2), I: Icd, lux: E, want, errPct: ((E - want) / want) * 100, pass: Math.abs(E - want) <= 0.03 * want });
          L.dispose(); rt.dispose();
        }
      }
      return out;
    }

    // ------------------------------------------------------------------ cost: n sprites in view, GPU time of their draw
    // As tests/manual/lamps-shots.mjs measured the GLSL layer's 1.7 ms: a GPU timer query around the sprites' draw (here
    // a render call holding only the layer, drawn over the depth of a lit plane), with the floor of one sprite. On the
    // node renderers the timer is three's own (trackTimestamp: timestamp queries on WebGPU, the same timer-query
    // extension on WebGL2), per render call. 1280 x 720.
    async function cost(n = 80000, frames = 40, nearM = 30) {
      const CW = 1280, CH = 720;
      const cam = camera([0, 1.5, 0], [0, 1.6, -100], CW, CH);
      const fill = (L) => {
        const cut = L.definePattern({ kind: 'cutoff', ...LAMP });
        let s = 12345;
        const rnd = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
        const tanX = Math.tan((FOV * Math.PI) / 360) * (CW / CH) * 0.95;
        for (let i = 0; i < n; i++) {
          const z = nearM * Math.exp(rnd() * Math.log(15000 / nearM)); // log-uniform nearM to 15 km
          const x = (rnd() * 2 - 1) * tanX * z;
          L.set(i, { position: [x, 9 + rnd() * 3, -z], color: [1, 0.78, 0.5], intensity: 6000 + rnd() * 10000, pattern: cut,
            aim: rnd() < 0.5 ? rnd() * 6.28 : null, diameter: 0.5, mount: 10 });
        }
      };
      const results = [];
      async function measure(label, flavor, r, opts) {
        const ground = new THREE.Scene(); litGround(ground, flavor, { box: false });
        const sprites = new THREE.Scene();
        const L = flavor === 'gl' ? glslSprites.createSpriteLayer({ capacity: n, name: 'cost' }) : nodeSprites.createSpriteLayer({ capacity: n, name: 'cost', photometry: CLASSIC, ...opts });
        sprites.add(L.mesh); fill(L); L.commit(n);
        L.setFrame({ camera: cam, renderer: r, gain: GAIN, visibility: 80000, glowRange: [800, 1000] });
        const rt = flavor === 'gl' ? glTarget(CW, CH) : nodeTarget(CW, CH);
        const times = { [n]: [], 1: [] };
        for (const count of [n, 1]) {
          L.commit(count);
          for (let i = 0; i < frames + 5; i++) {
            if (flavor === 'gl') {
              const g = gl.getContext(), ext = g.getExtension('EXT_disjoint_timer_query_webgl2');
              gl.setRenderTarget(rt); gl.autoClear = true; gl.render(ground, cam); gl.autoClear = false;
              const q = g.createQuery(); g.beginQuery(ext.TIME_ELAPSED_EXT, q); gl.render(sprites, cam); g.endQuery(ext.TIME_ELAPSED_EXT);
              gl.autoClear = true; gl.setRenderTarget(null);
              await new Promise((res) => { const poll = () => (g.getQueryParameter(q, g.QUERY_RESULT_AVAILABLE) ? res() : setTimeout(poll, 2)); poll(); });
              if (i >= 5 && !g.getParameter(ext.GPU_DISJOINT_EXT)) times[count].push(g.getQueryParameter(q, g.QUERY_RESULT) / 1e6);
              g.deleteQuery(q);
            } else {
              r.setRenderTarget(rt); r.autoClear = true; r.render(ground, cam);
              await r.resolveTimestampsAsync('render');
              r.autoClear = false; r.render(sprites, cam); r.autoClear = true; r.setRenderTarget(null);
              const ms = await r.resolveTimestampsAsync('render');
              if (i >= 5 && Number.isFinite(ms)) times[count].push(ms);
            }
          }
        }
        const med = (a) => { const s = [...a].sort((x, y) => x - y); return s.length ? s[s.length >> 1] : NaN; };
        const p95 = (a) => { const s = [...a].sort((x, y) => x - y); return s.length ? s[Math.floor(s.length * 0.95)] : NaN; };
        results.push({ layer: label, n, nearM, p50: med(times[n]), p95: p95(times[n]), oneSpriteP50: med(times[1]), samples: times[n].length });
        L.dispose(); rt.dispose();
      }
      await measure('glsl', 'gl', gl);
      if (!nodeSprites.__error) for (const [key, r] of Object.entries(renderers)) {
        await measure(`node ${backendOf[key]} tone=scene`, 'node', r, { tone: 'scene' });
        await measure(`node ${backendOf[key]} tone=sprite`, 'node', r, { tone: 'sprite' });
      }
      return results;
    }

    window.__parity = { cases: Object.keys(CASES), spriteCases: Object.keys(CASES).filter((c) => !c.startsWith('surface')), run, flux, cost, building: buildingCase, backends: backendOf,
      gpu: (() => { const g = gl.getContext(), e = g.getExtension('WEBGL_debug_renderer_info'); return e ? g.getParameter(e.UNMASKED_RENDERER_WEBGL) : 'n/a'; })() };
    log(`ready: ${JSON.stringify(backendOf)}`);
  </script>
</body>
