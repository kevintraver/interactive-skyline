<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Traffic node parity</title>
  <style>html, body { margin: 0; background: #111; color: #ccc; font: 12px system-ui; }</style>
</head>
<body>
  <!--
    Differential check of the traffic's node modules (plan 02, third stretch, decision 1) against their GLSL ones:
    the same fixture drawn with src/drive/traffic/{material,ribbon,pools,valley}.js on a WebGLRenderer and with
    their .node.js siblings on a WebGPURenderer (WebGL2 backend, forceWebGL, and the WebGPU backend), into a
    half-float target with linear output (no tone mapping), the same lights, camera and light scale. Driven by
    tests/manual/traffic-node-shots.mjs, which calls:
      window.__cases                         the fixture names
      await window.__compare(name, backend)  backend 'webgl2' | 'webgpu' -> { rel, mad, n, nan, png } against the
                                             GLSL frame of the case (drawn once and kept); see the function
      await window.__run(name, backend)      backend 'glsl' | 'webgl2' | 'webgpu' -> { w, h, rgba: number[] (linear),
                                             bg?: number[] (glsl only: the frame with the module's objects hidden) }
      await window.__cost(name, backend, n)  -> { on, off } median GPU ms of n frames with the module's objects shown and hidden
      window.__png(rgba, w, h, scale)        -> a PNG data URL (x scale, sRGB-encoded, clamped)
    The classic light constant is the light scale everywhere (LIGHTING_UNITS.nit = 0.1, written here so the page
    does not import the drive's stand-in): the GLSL modules get it inside their gains, the node modules as
    `lightScale` (a number in some fixtures, a uniform node in others) with gains of the look's fade alone.
  -->
  <script type="module">
    import * as THREE from 'three';
    import * as WG from 'three/webgpu';
    import { uniform } from 'three/tsl';
    import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
    import * as GLSL_MATERIAL from '/src/drive/traffic/material.js';
    import * as GLSL_RIBBON from '/src/drive/traffic/ribbon.js';
    import * as GLSL_POOLS from '/src/drive/traffic/pools.js';
    import * as GLSL_VALLEY from '/src/drive/traffic/valley.js';
    import { TWIN_UNIFORMS } from '/src/drive/lights/sprites.js';
    import { BODY_NAMES } from '/src/drive/traffic/fleet.js';
    import { decodeValley } from '/src/drive/traffic/valleyFormat.js';
    import { buildValleyGeometry } from '/src/drive/traffic/valleyGeometry.js';
    import { curveDrop } from '/src/world/frame.js';

    const NIT = 0.1;
    const SAMPLES = +(new URLSearchParams(location.search).get('samples') ?? 4);
    const W = 512, H = 320;
    const GLSL = { material: GLSL_MATERIAL, ribbon: GLSL_RIBBON, pools: GLSL_POOLS, valley: GLSL_VALLEY };
    let NODE = null;
    async function nodeModules() {
      if (!NODE) {
        // through a variable, so the page loads (and every node case fails) while a module is missing
        const dir = '/src/drive/traffic/';
        const [material, ribbon, pools, valley] = await Promise.all(
          ['material', 'ribbon', 'pools', 'valley'].map((m) => import(/* @vite-ignore */ `${dir}${m}.node.js`)),
        );
        NODE = { material, ribbon, pools, valley };
      }
      return NODE;
    }

    const sidecar = await (await fetch('/models/drive/vehicles.json')).json();
    const gltf = await new GLTFLoader().loadAsync('/models/drive/vehicles.glb');
    const palette = sidecar.palette.colors.map((c) => new THREE.Color().setStyle(`#${c.hex}`, THREE.SRGBColorSpace));

    // ------------------------------------------------------------------ bodies (as render.js builds them)
    const HEAD_LENS = [149, 156, 164], TAIL_LENS = [51, 2, 2];
    function lampAttribute(geo) {
      const c = geo.getAttribute('color'), n = geo.getAttribute('position').count, a = new Float32Array(n);
      const norm = c.normalized || c.array instanceof Float32Array ? 1 : 255;
      for (let i = 0; i < n; i++) {
        const r = Math.round((c.getX(i) * 255) / norm), g = Math.round((c.getY(i) * 255) / norm), b = Math.round((c.getZ(i) * 255) / norm);
        if (r === HEAD_LENS[0] && g === HEAD_LENS[1] && b === HEAD_LENS[2]) a[i] = 1;
        else if (r === TAIL_LENS[0] && g === TAIL_LENS[1] && b === TAIL_LENS[2]) a[i] = 2;
      }
      return new THREE.BufferAttribute(a, 1);
    }
    /** One InstancedMesh per body at `lod`, `per` instances each: rows across x, instances back along z. */
    function bodyMeshes(M, shared, lod, { per = 3, brake = [0, 1, 0], alpha = 1, rows = 1, spacing = 7 } = {}) {
      const meshes = [];
      let x = -26;
      BODY_NAMES.forEach((name, b) => {
        const spec = sidecar.bodies[name];
        const src = gltf.scene.getObjectByName(spec.nodes[`lod${lod}`]);
        const geo = src.geometry.clone();
        geo.setAttribute('_lamp', lampAttribute(geo));
        if (!geo.getAttribute('_paint')) geo.setAttribute('_paint', new THREE.BufferAttribute(new Float32Array(geo.getAttribute('position').count).fill(1), 1));
        const n = per * rows;
        const it = new THREE.InstancedBufferAttribute(new Float32Array(n * 2), 2);
        geo.setAttribute('iTraffic', it);
        const mesh = new THREE.InstancedMesh(geo, M.material.createBodyMaterial(src.material, shared), n);
        mesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(n * 3), 3);
        const m = new THREE.Matrix4();
        for (let r = 0; r < rows; r++) {
          for (let k = 0; k < per; k++) {
            const i = r * per + k;
            m.makeRotationY(k % 3 === 1 ? Math.PI * 0.85 : Math.PI * 0.2);
            m.setPosition(x + r * 60, 0, -k * Math.max(8, spec.length + 3));
            mesh.setMatrixAt(i, m);
            const col = palette[(k * 5 + b * 3 + r) % palette.length];
            mesh.instanceColor.setXYZ(i, col.r, col.g, col.b);
            it.setXY(i, typeof alpha === 'function' ? alpha(i) : alpha, brake[k % brake.length]);
          }
        }
        mesh.frustumCulled = false;
        meshes.push(mesh);
        x += spec.width + spacing;
      });
      return meshes;
    }
    function ground(scene, color = 0x3a3a3a, size = 600) {
      const g = new THREE.Mesh(new THREE.PlaneGeometry(size, size), new THREE.MeshStandardMaterial({ color, roughness: 0.9 }));
      g.rotation.x = -Math.PI / 2;
      scene.add(g);
      return g;
    }
    function bodyCamera() {
      const camera = new THREE.PerspectiveCamera(40, W / H, 0.5, 1000);
      camera.position.set(-6, 9, 26);
      camera.lookAt(-6, 1, -10);
      return camera;
    }
    function bodyFixture({ lod, night, alpha = 1, brake, lightScaleNode = false }) {
      return (kind, M) => {
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(night ? 0x010204 : 0x9fb3cc);
        if (night) scene.add(new THREE.HemisphereLight(0x8090b0, 0x202020, 0.05));
        else {
          scene.add(new THREE.HemisphereLight(0xdde8ff, 0x404040, 1.2));
          const sun = new THREE.DirectionalLight(0xffffff, 2.2);
          sun.position.set(-30, 50, 20);
          scene.add(sun);
        }
        ground(scene, night ? 0x202020 : 0x3a3a3a);
        const shared = kind === 'glsl' ? M.material.createTrafficUniforms()
          : M.material.createTrafficUniforms({ lightScale: lightScaleNode ? uniform(NIT) : NIT });
        shared.uniforms.uDusk.value = night ? 1 : 0;
        const meshes = bodyMeshes(M, shared, lod, { alpha, brake });
        for (const m of meshes) scene.add(m);
        return { scene, camera: bodyCamera(), objects: meshes };
      };
    }
    /**
     * Control: the night lod0 scene with three's own MeshStandardMaterial (vertex colours, no traffic code) on both
     * renderers: what the two renderers differ by when the traffic modules are not involved (MSAA resolve on edges).
     */
    function controlFixture({ night }) {
      return (kind, M) => {
        const fx = bodyFixture({ lod: 0, night, brake: [0, 0, 0] })(kind, M);
        for (const m of fx.objects) {
          m.material = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.55, metalness: 0 });
          m.geometry.deleteAttribute('iTraffic');
        }
        return fx;
      };
    }
    function shadowFixture({ fog }) {
      return (kind, M) => {
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xb8c4d0);
        // the GLSL contact shadow does not compile without scene fog (vFogDepth is declared only with USE_FOG), so
        // the fog-free case has a fog too thin to see: 1e-7 per metre
        scene.fog = new THREE.FogExp2(0xb8c4d0, fog ? 0.006 : 1e-7);
        scene.add(new THREE.HemisphereLight(0xdde8ff, 0x404040, 1.5));
        const sun = new THREE.DirectionalLight(0xffffff, 2.0);
        sun.position.set(-30, 50, 20);
        scene.add(sun);
        ground(scene, 0x8a8a8a);
        const shared = kind === 'glsl' ? M.material.createTrafficUniforms() : M.material.createTrafficUniforms({ lightScale: NIT });
        shared.uniforms.uStrength.value = 0.6;
        const quad = new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2);
        const N = 40;
        const iAlpha = new THREE.InstancedBufferAttribute(new Float32Array(N), 1);
        quad.setAttribute('iAlpha', iAlpha);
        const mesh = new THREE.InstancedMesh(quad, M.material.createShadowMaterial(shared), N);
        const m = new THREE.Matrix4(), s = new THREE.Vector3(), q = new THREE.Quaternion(), p = new THREE.Vector3();
        for (let i = 0; i < N; i++) {
          const row = Math.floor(i / 5), col = i % 5;
          q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), 0.3 * col - 0.6);
          s.set(2.2, 1, 5.2 + col);
          p.set(-14 + col * 7, 0.03, 10 - row * 22);
          m.compose(p, q, s);
          mesh.setMatrixAt(i, m);
          iAlpha.setX(i, [1, 0.75, 0.5, 0.25, 0.9][col]);
        }
        mesh.renderOrder = -1;
        mesh.frustumCulled = false;
        scene.add(mesh);
        const camera = new THREE.PerspectiveCamera(45, W / H, 0.5, 2000);
        camera.position.set(0, 12, 22);
        camera.lookAt(0, 0, -30);
        return { scene, camera, objects: [mesh] };
      };
    }

    // ------------------------------------------------------------------ a lane ribbon over a curved road
    const ROAD_R = 30000, ROAD_L = 20000;
    function roadFixtureModel() {
      const at = (s, r) => {
        const a = s / ROAD_R;
        r.x = ROAD_R * Math.sin(a); r.y = ROAD_R * (1 - Math.cos(a)); r.heading = a;
        r.h = 0.002 * s + 4 * Math.sin(s / 2500); r.grade = 0.002 + (4 / 2500) * Math.cos(s / 2500); r.crossfall = -0.02;
        return r;
      };
      const fwd = { refline: { at }, sign: 1 };
      const back = { refline: { at: (u, r) => { at(ROAD_L - u, r); r.heading += Math.PI; r.grade = -r.grade; return r; } }, sign: -1 };
      const traffic = {
        range: [0, ROAD_L],
        lanes: () => [{ lane: 1 }, { lane: 2 }, { lane: 3 }],
        segments: () => [{ s0: 0, truckShare: 0.12 }, { s0: 9000, truckShare: 0.3 }],
        laneDensities(dir, s, ms, out) {
          for (let l = 0; l < 8; l++) out[l] = l < 3 ? 0.012 * (1 + 0.6 * Math.sin(s / 900 + l * 1.3 + ms / 4e5)) * (dir === 'with' ? 1 : 0.75) : 0;
        },
      };
      const laneMap = {
        dirs: { with: fwd, against: back },
        atDir(ld, lane, s, lm) {
          lm.sRoad = ld.sign > 0 ? s : ROAD_L - s;
          lm.d = -((lane - 0.5) * 3.6 + 1.5);
          lm.dds = 0;
          lm.w = lane === 3 ? 0.8 : 1;
          return lm;
        },
      };
      const frame = { sceneY: (h) => h };
      return { traffic, laneMap, frame, at };
    }
    function ribbonFixture(distM) {
      return (kind, M, renderer) => {
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);
        const { traffic, laneMap, frame, at } = roadFixtureModel();
        const group = new THREE.Group();
        scene.add(group);
        const opts = { parent: group, traffic, laneMap, frame };
        if (kind !== 'glsl') opts.lightScale = distM > 3000 ? uniform(NIT) : NIT;
        const ribbons = M.ribbon.createRibbons(opts);
        const camera = new THREE.PerspectiveCamera(distM > 3000 ? 6 : 18, W / H, 1, 60000);
        const r = at(0, {});
        camera.position.set(r.x, r.h + 25, -r.y);
        const t = at(distM, {});
        camera.lookAt(t.x, t.h + 1, -t.y);
        camera.updateMatrixWorld();
        const before = () => ribbons.update({
          simMs: Date.parse('2026-11-21T01:30:00Z'), carS: 0, ahead: 900, behind: 450, band: 0.25, camera, renderer,
          gain: kind === 'glsl' ? NIT : 1, lit: 1, visibility: 40000, on: true,
        });
        return { scene, camera, objects: [ribbons.mesh], before, dispose: () => ribbons.dispose(), keepVisible: true };
      };
    }

    // ------------------------------------------------------------------ headlamp pools on a road plane
    function poolsFixture({ wet = 0, lightScaleNode = false }) {
      return (kind, M) => {
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);
        scene.add(new THREE.HemisphereLight(0x8090b0, 0x202020, 0.02));
        ground(scene, 0x303030, 2000);
        const group = new THREE.Group();
        scene.add(group);
        const opts = { parent: group, sidecar, bodyNames: BODY_NAMES };
        if (kind !== 'glsl') { opts.lightScale = lightScaleNode ? uniform(NIT) : NIT; opts.twinWet = TWIN_UNIFORMS.uTwinWet; }
        const pools = M.pools.createPools(opts);
        const cars = [[-1.8, -12, 0], [1.8, -30, 1], [-1.8, -55, 2], [5.4, -40, 0, true], [9, -80, 3, true], [-5.4, -95, 4], [1.8, -130, 5], [-9, -20, 1, true]];
        const n = cars.length;
        const near = { count: n, alpha: new Float32Array(n).fill(1), pos: new Float64Array(3 * n), fwd: new Float32Array(3 * n), up: new Float32Array(3 * n), id: new Float64Array(n), body: new Uint8Array(n) };
        cars.forEach(([x, z, b, oncoming], i) => {
          near.pos.set([x, 0, z], 3 * i);
          near.fwd.set([oncoming ? 0.05 : 0, 0, oncoming ? 1 : -1], 3 * i);
          const f = near.fwd.subarray(3 * i, 3 * i + 3); const l = Math.hypot(f[0], f[1], f[2]); f[0] /= l; f[2] /= l;
          near.up.set([0, 1, 0], 3 * i);
          near.id[i] = i + 1; near.body[i] = b; near.alpha[i] = i === 2 ? 0.5 : 1;
        });
        const camera = new THREE.PerspectiveCamera(50, W / H, 0.3, 3000);
        camera.position.set(0, 1.4, 6);
        camera.lookAt(0, 0, -40);
        camera.updateMatrixWorld();
        const before = () => {
          TWIN_UNIFORMS.uTwinWet.value = wet;
          pools.update({ near, eye: camera.position, ambient: 0, gain: kind === 'glsl' ? NIT : 1, threshold: () => 1e9 });
        };
        const after = () => { TWIN_UNIFORMS.uTwinWet.value = 0; };
        return { scene, camera, objects: [pools.mesh], before, after, dispose: () => pools.dispose(), keepVisible: true };
      };
    }

    // ------------------------------------------------------------------ a patch of the valley's ribbons
    const valleyDoc = await (await fetch('/data/lv/traffic/valley.json')).json();
    const valleyBin = await (await fetch(`/data/lv/traffic/${valleyDoc.file || 'valley.bin'}`)).arrayBuffer();
    const valleyBounds = buildValleyGeometry(decodeValley(valleyDoc, valleyBin), { heightAt: () => 0, base: 0, curveDrop }).bounds;
    function valleyFixture({ view }) {
      return async (kind, M, renderer) => {
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);
        const group = new THREE.Group();
        scene.add(group);
        const ctx = {
          optional: async (p) => (p === 'traffic/valley.json' ? valleyDoc : null),
          get: async () => ({ arrayBuffer: async () => valleyBin.slice(0) }),
          env: { lighting: { units: { nit: NIT } }, weather: null, city: { tz: 'America/Los_Angeles' } },
          terrain: { surfaceAt: () => 0 }, base: 0, app: { renderer }, group,
        };
        const part = kind === 'glsl' ? await M.valley.createValleyPart(ctx) : await M.valley.createValleyPart(ctx, { lightScale: uniform(NIT) });
        const [x0, y0, x1, y1] = valleyBounds;
        const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
        const camera = new THREE.PerspectiveCamera(view === 'wide' ? 60 : 25, W / H, 5, 120000);
        if (view === 'wide') { camera.position.set(cx, 900, -(cy - 14000)); camera.lookAt(cx, 0, -(cy + 2000)); }
        else { camera.position.set(cx + 1500, 250, -(cy - 3000)); camera.lookAt(cx, 0, -(cy + 1500)); }
        camera.updateMatrixWorld();
        const simMs = Date.parse('2026-11-21T02:00:00Z');
        part.setRoute({ route: { id: 'i15n' } });
        part.setLook({ lights: 1 });
        const before = () => { part.update({ simMs }); part.beforeRender({ camera, simMs }); };
        return { scene, camera, objects: [part.mesh], before, dispose: () => part.dispose(), keepVisible: true };
      };
    }

    const FIXTURES = {
      'bodies-day-lod0': bodyFixture({ lod: 0, night: false }),
      'bodies-day-lod1': bodyFixture({ lod: 1, night: false }),
      'bodies-night-lod0': bodyFixture({ lod: 0, night: true, brake: [0, 0, 0] }),
      'bodies-night-lod1': bodyFixture({ lod: 1, night: true, brake: [0, 0, 0], lightScaleNode: true }),
      'bodies-brake-lod0': bodyFixture({ lod: 0, night: true, brake: [1, 0, 1], lightScaleNode: true }),
      'bodies-dissolve-lod0': bodyFixture({ lod: 0, night: false, alpha: 0.5 }),
      'bodies-dissolve-lod1-night': bodyFixture({ lod: 1, night: true, alpha: 0.5, brake: [0, 1, 0] }),
      'control-three-day-lod0': controlFixture({ night: false }),
      'control-three-night-lod0': controlFixture({ night: true }),
      'shadows': shadowFixture({ fog: false }),
      'shadows-fog': shadowFixture({ fog: true }),
      'ribbon-1km': ribbonFixture(1000),
      'ribbon-5km': ribbonFixture(5000),
      'ribbon-15km': ribbonFixture(15000),
      'pools': poolsFixture({}),
      'pools-wet': poolsFixture({ wet: 0.42, lightScaleNode: true }),
      'valley-near': valleyFixture({ view: 'near' }),
      'valley-wide': valleyFixture({ view: 'wide' }),
    };
    window.__cases = Object.keys(FIXTURES);

    // ------------------------------------------------------------------ renderers, targets, read back
    async function makeRenderer(backend, { timing = false } = {}) {
      const canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = H;
      document.body.appendChild(canvas);
      let renderer;
      if (backend === 'glsl') renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
      else {
        renderer = new WG.WebGPURenderer({ canvas, antialias: false, forceWebGL: backend === 'webgl2', trackTimestamp: timing });
        await renderer.init();
        const isWebGPU = !!renderer.backend.isWebGPUBackend;
        if (isWebGPU !== (backend === 'webgpu')) throw new Error(`asked for ${backend}, got ${isWebGPU ? 'webgpu' : 'webgl2'}`);
      }
      renderer.setPixelRatio(1);
      renderer.setSize(W, H, false);
      renderer.toneMapping = THREE.NoToneMapping;
      renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
      renderer.setClearColor(0x000000, 1);
      const rt = backend === 'glsl'
        ? new THREE.WebGLRenderTarget(W, H, { type: THREE.HalfFloatType, samples: SAMPLES })
        : new WG.RenderTarget(W, H, { type: THREE.HalfFloatType, samples: SAMPLES });
      return { renderer, rt, canvas };
    }
    const half = (h) => {
      const s = (h & 0x8000) ? -1 : 1, e = (h >> 10) & 0x1f, f = h & 0x3ff;
      if (e === 0) return s * 2 ** -14 * (f / 1024);
      if (e === 31) return f ? NaN : s * Infinity;
      return s * 2 ** (e - 15) * (1 + f / 1024);
    };
    /** rgba floats, rows top to bottom */
    async function readBack(backend, renderer, rt) {
      let raw;
      if (backend === 'glsl') {
        raw = new Uint16Array(W * H * 4);
        renderer.readRenderTargetPixels(rt, 0, 0, W, H, raw);
      } else raw = await renderer.readRenderTargetPixelsAsync(rt, 0, 0, W, H);
      const f = raw instanceof Float32Array ? raw : Float32Array.from(raw, half);
      // WebGL reads rows from the bottom; WebGPU from the top
      const flip = backend === 'glsl' || backend === 'webgl2';
      const out = new Float32Array(W * H * 4);
      for (let y = 0; y < H; y++) {
        const sy = flip ? H - 1 - y : y;
        for (let i = 0; i < W * 4; i++) out[y * W * 4 + i] = f[sy * W * 4 + i];
      }
      return out;
    }
    function draw(renderer, rt, fx) {
      renderer.setRenderTarget(rt);
      renderer.clear();
      renderer.render(fx.scene, fx.camera);
      renderer.setRenderTarget(null);
    }
    async function build(name, backend, renderer) {
      const fx = await FIXTURES[name](backend === 'glsl' ? 'glsl' : 'node', backend === 'glsl' ? GLSL : await nodeModules(), renderer);
      fx.before?.();
      return fx;
    }
    function teardown(backend, renderer, rt, canvas, fx) {
      fx?.after?.();
      fx?.dispose?.();
      rt.dispose();
      renderer.dispose();
      canvas.remove();
    }

    /** One fixture on one renderer: { rgba: Float32Array, bg?: Float32Array (glsl only) } */
    async function runRaw(name, backend) {
      const { renderer, rt, canvas } = await makeRenderer(backend);
      let fx;
      try {
        fx = await build(name, backend, renderer);
        if (backend !== 'glsl') await renderer.compileAsync?.(fx.scene, fx.camera);
        draw(renderer, rt, fx);
        const rgba = await readBack(backend, renderer, rt);
        let bg;
        if (backend === 'glsl') {
          for (const o of fx.objects) o.visible = false;
          draw(renderer, rt, fx);
          bg = await readBack(backend, renderer, rt);
          for (const o of fx.objects) o.visible = true;
        }
        return { rgba, bg };
      } finally { teardown(backend, renderer, rt, canvas, fx); }
    }
    window.__run = async (name, backend) => {
      const r = await runRaw(name, backend);
      return { w: W, h: H, rgba: Array.from(r.rgba), bg: r.bg && Array.from(r.bg) };
    };

    // the comparison in the page, so only numbers and PNGs cross to the script
    const refs = new Map();
    /**
     * -> { rel, mad, n, nan, png: { test, diff, ref? } }: rel = sum |node - glsl| / sum |glsl - background| over RGB;
     * mad = the mean absolute difference per channel over the n pixels either frame changes; the PNGs share one
     * display scale (the reference's 99.5th percentile to 1; the difference x 10). The GLSL frame is drawn once per case.
     */
    window.__compare = async (name, backend) => {
      let ref = refs.get(name), refPng = null;
      if (!ref) {
        ref = await runRaw(name, 'glsl');
        const a = ref.rgba, lum = new Float32Array(W * H);
        for (let i = 0; i < W * H; i++) lum[i] = Math.max(a[4 * i], a[4 * i + 1], a[4 * i + 2]);
        lum.sort();
        ref.scale = 1 / Math.max(1e-6, lum[Math.floor(lum.length * 0.995)]);
        refs.set(name, ref);
        refPng = window.__png(a, W, H, ref.scale);
      }
      const { rgba: a, bg, scale } = ref;
      const b = (await runRaw(name, backend)).rgba;
      let num = 0, den = 0, mad = 0, n = 0, nan = 0;
      const diff = new Float32Array(W * H * 4);
      for (let i = 0; i < W * H; i++) {
        let changed = false;
        for (let c = 0; c < 3; c++) {
          const k = 4 * i + c;
          if (!Number.isFinite(b[k])) nan++;
          const d = Math.abs((Number.isFinite(b[k]) ? b[k] : 1e3) - a[k]);
          num += d; den += Math.abs(a[k] - bg[k]);
          diff[k] = d * 10;
          if (Math.abs(a[k] - bg[k]) > 1e-5 || Math.abs(b[k] - bg[k]) > 1e-5) changed = true;
        }
        diff[4 * i + 3] = 1;
        if (changed) { n++; for (let c = 0; c < 3; c++) mad += Math.abs(b[4 * i + c] - a[4 * i + c]) / 3; }
      }
      return {
        rel: num / Math.max(den, 1e-9), mad: n ? mad / n : 0, n, nan,
        png: { ref: refPng, test: window.__png(b, W, H, scale), diff: window.__png(diff, W, H, scale) },
      };
    };

    // ------------------------------------------------------------------ cost: GPU time of the module's objects
    const COST = {
      bodies: (kind, M) => {
        const scene = new THREE.Scene();
        scene.add(new THREE.HemisphereLight(0x8090b0, 0x202020, 0.05));
        const sun = new THREE.DirectionalLight(0xffffff, 0.3); sun.position.set(-30, 50, 20); scene.add(sun);
        ground(scene, 0x202020, 3000);
        const shared = kind === 'glsl' ? M.material.createTrafficUniforms() : M.material.createTrafficUniforms({ lightScale: NIT });
        shared.uniforms.uDusk.value = 1;
        const meshes = [...bodyMeshes(M, shared, 0, { per: 20, rows: 5, alpha: (i) => (i % 4 === 0 ? 0.5 : 1) }), ...bodyMeshes(M, shared, 1, { per: 40, rows: 5 })];
        meshes.forEach((m, i) => { if (i >= BODY_NAMES.length) m.position.z = -300; m.updateMatrixWorld(); });
        for (const m of meshes) scene.add(m);
        const camera = new THREE.PerspectiveCamera(50, W / H, 0.5, 3000);
        camera.position.set(100, 25, 60); camera.lookAt(100, 0, -200);
        return { scene, camera, objects: meshes };
      },
      shadows: (kind, M) => {
        const fx = shadowFixture({ fog: true })(kind, M);
        return fx;
      },
      ribbon: ribbonFixture(3000),
      pools: (kind, M) => {
        const fx = poolsFixture({})(kind, M);
        return fx;
      },
      valley: valleyFixture({ view: 'wide' }),
    };
    window.__costCases = Object.keys(COST);
    const median = (a) => { const b = a.filter((x) => Number.isFinite(x)).sort((x, y) => x - y); return b.length ? b[b.length >> 1] : null; };
    function glTimer(renderer) {
      const gl = renderer.getContext();
      const ext = gl.getExtension('EXT_disjoint_timer_query_webgl2');
      if (!ext) return null;
      return async (fn) => {
        const q = gl.createQuery();
        gl.beginQuery(ext.TIME_ELAPSED_EXT, q);
        fn();
        gl.endQuery(ext.TIME_ELAPSED_EXT);
        gl.flush();
        for (let k = 0; k < 400; k++) {
          await new Promise((r) => setTimeout(r, 2));
          if (gl.getQueryParameter(q, gl.QUERY_RESULT_AVAILABLE)) {
            const disjoint = gl.getParameter(ext.GPU_DISJOINT_EXT);
            const ns = gl.getQueryParameter(q, gl.QUERY_RESULT);
            gl.deleteQuery(q);
            return disjoint ? null : ns / 1e6;
          }
        }
        return null;
      };
    }
    window.__cost = async (name, backend, n = 60) => {
      const { renderer, rt, canvas } = await makeRenderer(backend, { timing: backend !== 'glsl' });
      let fx;
      try {
        const kind = backend === 'glsl' ? 'glsl' : 'node';
        fx = await COST[name](kind, backend === 'glsl' ? GLSL : await nodeModules(), renderer);
        fx.before?.();
        if (backend !== 'glsl') await renderer.compileAsync?.(fx.scene, fx.camera);
        const timer = backend === 'glsl' ? glTimer(renderer) : async (fn) => {
          fn();
          // the summed duration of the render passes since the last resolve (r187 returns it)
          return renderer.resolveTimestampsAsync('render');
        };
        const frames = async () => {
          const ms = [];
          for (let i = 0; i < 5; i++) draw(renderer, rt, fx);
          for (let i = 0; i < n; i++) ms.push(await timer(() => draw(renderer, rt, fx)));
          return median(ms);
        };
        const on = await frames();
        for (const o of fx.objects) o.visible = false;
        const off = await frames();
        return { on, off, delta: on != null && off != null ? on - off : null };
      } finally { teardown(backend, renderer, rt, canvas, fx); }
    };

    // ------------------------------------------------------------------ images
    window.__png = (rgba, w, h, scale) => {
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const ctx = c.getContext('2d'); const img = ctx.createImageData(w, h);
      const enc = (v) => { v = Math.min(1, Math.max(0, v)); return Math.round(255 * (v <= 0.0031308 ? 12.92 * v : 1.055 * v ** (1 / 2.4) - 0.055)); };
      for (let i = 0; i < w * h; i++) {
        img.data[4 * i] = enc(rgba[4 * i] * scale); img.data[4 * i + 1] = enc(rgba[4 * i + 1] * scale); img.data[4 * i + 2] = enc(rgba[4 * i + 2] * scale); img.data[4 * i + 3] = 255;
      }
      ctx.putImageData(img, 0, 0);
      return c.toDataURL('image/png');
    };
    window.__ready = true;
  </script>
</body>
</html>
